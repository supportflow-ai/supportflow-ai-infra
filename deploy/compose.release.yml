# Standalone release stack: application images must come from images.env.
name: supportflow-${DEPLOY_ENV:?Set DEPLOY_ENV}
services:
  postgres:
    restart: unless-stopped
    networks: &id001
    - supportflow-network
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: pgvector/pgvector:0.8.1-pg17-bookworm@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicedesk}
      POSTGRES_USER: ${POSTGRES_USER:-servicedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  minio:
    restart: unless-stopped
    networks: *id001
    logging: *id002
    image: ${MINIO_IMAGE:-ghcr.io/supportflow-ai/servicedesk-minio:RELEASE.2025-10-15T17-29-55Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  minio-init:
    image: ${MINIO_MC_IMAGE:-ghcr.io/supportflow-ai/servicedesk-minio:RELEASE.2025-10-15T17-29-55Z}
    depends_on:
      minio:
        condition: service_healthy
    networks:
    - supportflow-network
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-servicedesk-attachments}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY}
      MINIO_LIFECYCLE_FILE: /opt/supportflow/pending-upload-lifecycle.json
    volumes:
    - ../scripts/init_minio_buckets.sh:/opt/supportflow/init_minio_buckets.sh:ro
    - ../storage/pending-upload-lifecycle.json:/opt/supportflow/pending-upload-lifecycle.json:ro
    entrypoint:
    - /bin/sh
    - /opt/supportflow/init_minio_buckets.sh
  migration: &migration_job
    restart: 'no'
    networks: *id001
    logging: *id002
    command: ["migrate"]
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-servicedesk};Username=${POSTGRES_USER:-servicedesk};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    image: ${DATABASE_IMAGE:?Set immutable image from release manifest}
    pull_policy: always
  seed-roles:
    <<: *migration_job
    command: ["seed-roles"]
    depends_on:
      migration:
        condition: service_completed_successfully
  api-1:
    restart: unless-stopped
    networks: *id001
    logging: *id002
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-servicedesk};Username=${POSTGRES_USER:-servicedesk};Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY (min 32 bytes)}
      Jwt__Issuer: ${JWT_ISSUER:-supportflow-auth}
      Jwt__Audience: ${JWT_AUDIENCE:-supportflow-api}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-1440}
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT to
        the externally reachable storage origin}
      Minio__AccessKey: ${MINIO_APP_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_APP_SECRET_KEY}
      Minio__Bucket: ${MINIO_DEFAULT_BUCKET:-servicedesk-attachments}
      Ai__Endpoint: http://ai-service:8000
      Ai__BearerToken: ${AI_S2S_BEARER_TOKEN:?Set AI_S2S_BEARER_TOKEN}
      KnowledgeIndex__Enabled: "true"
      KnowledgeIndex__Endpoint: http://ai-service:8000
      KnowledgeIndex__BearerToken: ${AI_S2S_BEARER_TOKEN:?Set AI_S2S_BEARER_TOKEN}
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent http://localhost:8080/health/ready || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      seed-roles:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    image: ${API_IMAGE:?Set immutable image from release manifest}
    pull_policy: always
  api-2:
    restart: unless-stopped
    networks: *id001
    logging: *id002
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-servicedesk};Username=${POSTGRES_USER:-servicedesk};Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY (min 32 bytes)}
      Jwt__Issuer: ${JWT_ISSUER:-supportflow-auth}
      Jwt__Audience: ${JWT_AUDIENCE:-supportflow-api}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-1440}
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT to
        the externally reachable storage origin}
      Minio__AccessKey: ${MINIO_APP_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_APP_SECRET_KEY}
      Minio__Bucket: ${MINIO_DEFAULT_BUCKET:-servicedesk-attachments}
      Ai__Endpoint: http://ai-service:8000
      Ai__BearerToken: ${AI_S2S_BEARER_TOKEN:?Set AI_S2S_BEARER_TOKEN}
      KnowledgeIndex__Enabled: "true"
      KnowledgeIndex__Endpoint: http://ai-service:8000
      KnowledgeIndex__BearerToken: ${AI_S2S_BEARER_TOKEN:?Set AI_S2S_BEARER_TOKEN}
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent http://localhost:8080/health/ready || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      seed-roles:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    image: ${API_IMAGE:?Set immutable image from release manifest}
    pull_policy: always
  worker:
    restart: unless-stopped
    networks: *id001
    logging: *id002
    environment:
      DOTNET_ENVIRONMENT: Production
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-servicedesk};Username=${POSTGRES_USER:-servicedesk};Password=${POSTGRES_PASSWORD}
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT to
        the externally reachable storage origin}
      Minio__AccessKey: ${MINIO_APP_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_APP_SECRET_KEY}
      Minio__Bucket: ${MINIO_DEFAULT_BUCKET:-servicedesk-attachments}
      Ai__Endpoint: http://ai-service:8000
      Ai__BearerToken: ${AI_S2S_BEARER_TOKEN:?Set AI_S2S_BEARER_TOKEN}
      KnowledgeIndex__Enabled: "true"
      KnowledgeIndex__Endpoint: http://ai-service:8000
      KnowledgeIndex__BearerToken: ${AI_S2S_BEARER_TOKEN:?Set AI_S2S_BEARER_TOKEN}
    depends_on:
      seed-roles:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    image: ${WORKER_IMAGE:?Set immutable image from release manifest}
    pull_policy: always
  ai-service:
    restart: unless-stopped
    networks: *id001
    logging: *id002
    environment:
      SUPPORTFLOW_AI_ENVIRONMENT: production
      SUPPORTFLOW_AI_CLASSIFIER_PROVIDER: rule
      SUPPORTFLOW_AI_EMBEDDING_PROVIDER: local-e5
      SUPPORTFLOW_AI_EMBEDDING_CACHE_DIR: /opt/models
      SUPPORTFLOW_AI_SERVICE_TOKEN: ${AI_S2S_BEARER_TOKEN:?Set AI_S2S_BEARER_TOKEN}
    image: ${AI_IMAGE:?Set immutable image from release manifest}
    pull_policy: always
  web:
    restart: unless-stopped
    networks: *id001
    logging: *id002
    depends_on:
    - api-1
    - api-2
    image: ${WEB_IMAGE:?Set immutable image from release manifest}
    pull_policy: always
  gateway:
    restart: unless-stopped
    networks: *id001
    logging: *id002
    image: nginx:1.27-alpine
    ports:
    - ${GATEWAY_PORT:-80}:80
    - ${STORAGE_BIND_ADDRESS:-127.0.0.1}:${STORAGE_GATEWAY_PORT:-9000}:9000
    volumes:
    - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
networks:
  supportflow-network:
    name: supportflow-${DEPLOY_ENV}-network
volumes:
  postgres-data:
    name: supportflow-${DEPLOY_ENV}-postgres-data
  minio-data:
    name: supportflow-${DEPLOY_ENV}-minio-data
