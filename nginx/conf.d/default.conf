upstream backend_cluster {
    server api-1:8080 max_fails=3 fail_timeout=10s;
    server api-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_web {
    server web:80;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Buffer & Timeout settings
    client_max_body_size 50M;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Deny public access to internal endpoints (S2S and AI services)
    location ^~ /internal {
        default_type text/plain;
        return 403 "Forbidden: Internal services are not accessible externally.\n";
    }

    # Redirect /api to /api/ with trailing slash (preserve method)
    location = /api {
        return 308 /api/;
    }

    # API endpoints -> load balanced to backend cluster (api-1 & api-2)
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /api;

        # Disable buffering for real-time streaming and chunked responses
        proxy_buffering off;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Backend Health Check routes (/health, /health/live, /health/ready)
    location /health {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Single Page Application
    location / {
        proxy_pass http://frontend_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# S3 signatures include the original Host (including the port).
# Terminate HTTPS for the storage origin before this listener when deploying publicly.
server {
    listen 9000;
    server_name _;
    client_max_body_size 12m;
    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
