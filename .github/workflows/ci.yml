name: Infra CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-configs:
    name: Validate Compose & NGINX Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment files for linting
        run: |
          cp example.env .env
          cp deploy/example.env deploy/.env

      - name: Validate Local docker-compose.yml syntax
        run: |
          docker compose --env-file example.env -f docker-compose.yml config --quiet

      - name: Validate System deploy/compose.system.yml syntax
        run: |
          docker compose --env-file deploy/example.env -f deploy/compose.system.yml config --quiet

      - name: Kiểm thử script init và cấu hình Compose
        run: python3 -m unittest discover -s tests/unit -v

      - name: Test NGINX Configuration Syntax
        run: |
          docker run --rm \
            --add-host api-1:127.0.0.1 \
            --add-host api-2:127.0.0.1 \
            --add-host minio:127.0.0.1 \
            --add-host web:127.0.0.1 \
            -v ${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v ${{ github.workspace }}/nginx/conf.d:/etc/nginx/conf.d:ro \
            nginx:1.27-alpine nginx -t

      - name: Check Python scripts syntax
        run: |
          python3 -m py_compile scripts/run_smoke_tests.py
          python3 -m py_compile tests/smoke/gateway_routing_test.py

  minio-integration:
    name: Kiểm thử khởi tạo MinIO thật
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra shell script
        run: sh -n scripts/init_minio_buckets.sh
      - name: Bucket tùy chỉnh, chạy lại và chặn dependency khi init lỗi
        run: python3 -m unittest discover -s tests/integration -v

  smoke:
    name: Disposable Stack & Full Smoke Test (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: locked
            backend: ''
          # Mốc kiểm chứng Migrator, tách khỏi source lock và digest phát hành.
          - profile: migrator
            backend: 97ab0477350c309ca9f578304e56ce530d7c9899
    env:
      BACKEND_PATH: ./_sources/backend
      WEB_PATH: ./_sources/web
      SMOKE_BACKEND_SHA: ${{ matrix.backend }}
      COMPOSE_PROJECT_NAME: supportflow-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable source commits
        id: sources
        run: |
          python - <<'PY'
          import json, os, re
          values = json.load(open('sources.lock.json'))
          sources = {
              'backend': os.environ.get('SMOKE_BACKEND_SHA') or values['backend'],
              'web': values['web'],
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, sha in sources.items():
                  assert re.fullmatch(r'[0-9a-f]{40}', sha), key
                  print(f'{key}={sha}', file=out)
                  print(f'{key}={sha}')
          PY
      - uses: actions/checkout@v4
        with:
          repository: supportflow-ai/ai-it-service-desk
          ref: ${{ steps.sources.outputs.backend }}
          path: _sources/backend
      - uses: actions/checkout@v4
        with:
          repository: supportflow-ai/ai-it-service-desk-web
          ref: ${{ steps.sources.outputs.web }}
          path: _sources/web
      - name: Xác định Dockerfile của công cụ migration theo SHA đã ghim
        run: |
          current=src/backend/ServiceDesk.Migrator/Dockerfile
          legacy=src/backend/ServiceDesk.Database/Dockerfile
          if [[ -f "$BACKEND_PATH/$current" ]]; then
            echo "BACKEND_MIGRATOR_DOCKERFILE=$current" >> "$GITHUB_ENV"
          elif [[ -z "$SMOKE_BACKEND_SHA" && -f "$BACKEND_PATH/$legacy" ]]; then
            echo "BACKEND_MIGRATOR_DOCKERFILE=$legacy" >> "$GITHUB_ENV"
          else
            echo "::error::SHA backend đã ghim thiếu Dockerfile cho công cụ migration."
            exit 1
          fi
      - name: Set up smoke test runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate configuration
        run: docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml config --quiet
      - name: Build and start disposable stack
        run: docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml up --build -d --wait --wait-timeout 300
      - name: Xác minh Migrator, seed vai trò và Worker
        if: matrix.profile == 'migrator'
        run: |
          compose=(docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml)
          for service in migrate seed-roles; do
            id=$("${compose[@]}" ps --all --quiet "$service")
            test "$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' "$id")" = exited:0
            test "$(docker inspect --format '{{json .Config.Entrypoint}}' "$id")" = '["dotnet","ServiceDesk.Migrator.dll"]'
            echo "$service: ServiceDesk.Migrator.dll, exit 0"
          done
          test -n "$("${compose[@]}" ps --status running --quiet worker)"
      - name: Explicit demo setup and requester smoke
        run: |
          docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml run --rm migrate seed-demo
          bash deploy/smoke/smoke-test.sh
          curl --fail --silent http://localhost/ > /dev/null
          curl --fail --silent http://localhost/health/live > /dev/null
          curl --fail --silent http://localhost/health/ready > /dev/null
      - name: Kiểm chứng migration lỗi chặn API và Worker
        if: matrix.profile == 'migrator'
        run: |
          compose=(docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml)
          "${compose[@]}" down -v
          override="$RUNNER_TEMP/fail-migration.yaml"
          cat > "$override" <<'YAML'
          services:
            migrate:
              environment:
                Database__ConnectionString: Host=postgres;Port=1;Database=servicedesk;Username=servicedesk;Password=ci_invalid;Timeout=2
          YAML
          failure=("${compose[@]}" -f "$override")
          if "${failure[@]}" up --no-build -d api-1 api-2 worker; then
            echo "::error::Compose đã khởi động dù cấu hình migration bị lỗi."
            exit 1
          fi
          id=$("${failure[@]}" ps --all --quiet migrate)
          test "$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' "$id")" = exited:1
          for service in seed-roles api-1 api-2 worker; do
            id=$("${failure[@]}" ps --all --quiet "$service")
            if [[ -n "$id" ]]; then
              test "$(docker inspect --format '{{.State.Status}}' "$id")" = created
            fi
            echo "$service: bị chặn trước khi khởi động"
          done
      - name: Diagnostics
        if: always()
        run: docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml logs --no-color
      - name: Remove disposable CI stack
        if: always()
        run: docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml down -v
