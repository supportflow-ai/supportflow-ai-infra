{
  "services": {
    "jenkins": {
      "build": {
        "context": "./deploy/jenkins"
      },
      "ports": [
        "127.0.0.1:8080:8080"
      ],
      "user": "root",
      "environment": {
        "JENKINS_ADMIN_PASSWORD": "${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD}",
        "JAVA_OPTS": "-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true",
        "CASC_JENKINS_CONFIG": "/var/jenkins_home/casc.yaml",
        "TESTCONTAINERS_HOST_OVERRIDE": "host.docker.internal",
        "DOCKER_HOST": "unix:///var/run/docker.sock"
      },
      "volumes": [
        "jenkins_home:/var/jenkins_home",
        "/var/run/docker.sock:/var/run/docker.sock",
        ".:/workspace",
        "./deploy/jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro"
      ],
      "restart": "unless-stopped"
    }
  },
  "volumes": {
    "jenkins_home": {}
  }
}
