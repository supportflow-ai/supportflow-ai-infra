# Stack kiểm thử dùng một lần, không dùng volume/port của hệ thống local.
services:
  minio:
    build:
      context: ../..
      dockerfile: deploy/minio/Dockerfile
    command: server /data
    tmpfs:
      - /data
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_USER:?required}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio-init:
    build:
      context: ../..
      dockerfile: deploy/minio/Dockerfile
    entrypoint: ["/bin/sh", "/opt/supportflow/init_minio_buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_USER:?required}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_INIT_PASSWORD:?required}
      MINIO_DEFAULT_BUCKET: ${TEST_MINIO_BUCKET:?required}
      MINIO_INIT_MAX_ATTEMPTS: "1"
    volumes:
      - ../../scripts/init_minio_buckets.sh:/opt/supportflow/init_minio_buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy
  protected-service:
    build:
      context: ../..
      dockerfile: deploy/minio/Dockerfile
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
